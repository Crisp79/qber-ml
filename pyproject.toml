[project]
name = "qber-ml"
version = "0.1.0"
description = "Temporal-QBER attack detection for BB84 QKD using ML"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "shap>=0.42",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "joblib>=1.3",
    "kaggle>=2.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
